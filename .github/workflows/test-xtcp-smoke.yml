name: Test · XTCP smoke

on:
  workflow_dispatch:
  push:
    branches: [feat/throughput-m0]
  pull_request:
    branches: [main]

concurrency:
  group: test-xtcp-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-smoke:
    name: Linux XTCP smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libboost-all-dev libssl-dev

      - name: Prepare pinned XTCP
        run: bash tools/prepare_xtcp.sh

      - name: Configure tests
        run: |
          cmake -S tests/cpp -B build/xtcp-smoke \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_XTCP_TESTS=ON

      - name: Build tests
        run: cmake --build build/xtcp-smoke --parallel 10

      - name: Run full tests
        run: ctest --test-dir build/xtcp-smoke --output-on-failure -j10

      - name: Configure upstream XTCP suite
        run: |
          cmake -S third-party/xtcp -B build/xtcp-suite \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DXTCP_BUILD_TESTS=ON

      - name: Build upstream XTCP suite
        run: cmake --build build/xtcp-suite --parallel 10

      # The patched upstream suite must pass. A few timing-sensitive cases
      # can fail under full -j10 load on shared runners, so a failed case
      # gets one retry.
      - name: Run upstream XTCP suite
        run: ctest --test-dir build/xtcp-suite --output-on-failure -j10 --repeat until-pass:2

      - name: Capture throughput JSON
        run: |
          mkdir -p build/xtcp-smoke/results
          build/xtcp-smoke/xtcp_runtime_bridge_test --throughput xtcp 3 \
            > build/xtcp-smoke/results/xtcp.jsonl
          build/xtcp-smoke/xtcp_runtime_bridge_test --throughput native 3 \
            > build/xtcp-smoke/results/native.jsonl

      - name: Upload throughput JSON
        uses: actions/upload-artifact@v4
        with:
          name: xtcp-smoke-throughput
          path: build/xtcp-smoke/results/*.jsonl
          if-no-files-found: error
          retention-days: 7
