name: Documentation

on:
  pull_request:
    paths: ['docs/**', 'tools/docs_site.py', 'tools/docs_theme/**', 'tools/check_docs.py', 'tests/tooling/test_docs_site.py', 'zensical.toml', 'requirements-docs.txt', '.github/workflows/docs.yml']
  push:
    branches: [main]
    paths: ['docs/**', 'tools/docs_site.py', 'tools/docs_theme/**', 'tools/check_docs.py', 'tests/tooling/test_docs_site.py', 'zensical.toml', 'requirements-docs.txt', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: python -m pip install -r requirements-docs.txt
      - name: Documentation governance and builder tests
        run: |
          python -m unittest tests.tooling.test_check_docs tests.tooling.test_docs_site -v
          python tools/check_docs.py
      - name: Strict bilingual build and generated link check
        run: python tools/docs_site.py build
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs-site/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages (enable Actions source on first deployment)
        uses: actions/configure-pages@v5
        with:
          token: ${{ secrets.PAGES_SETUP_TOKEN || github.token }}
          enablement: ${{ secrets.PAGES_SETUP_TOKEN != '' }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
