name: Test · Unit

on:
  workflow_dispatch:
  push:
    branches: [feat/unit-tests, main]
  pull_request:
    branches: [main, codex/runtime-ui-lifecycle-integration]

concurrency:
  group: test-unit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  p2p-v2-isolation:
    name: P2P v2 isolated ASan and UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang libboost-all-dev libssl-dev
      - name: Run isolated P2P v2 sanitizers
        run: CXX=clang++ sh scripts/run-p2p-v2-isolation.sh asan

  lifecycle-sanitizers:
    name: Lifecycle ASan and UBSan
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang libboost-all-dev libssl-dev
      - name: Run lifecycle sanitizers
        run: bash scripts/run-lifecycle-sanitizers.sh

  cpp-tsan:
    name: C++ ThreadSanitizer
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang libboost-all-dev libssl-dev libstdc++-14-dev
      - name: Run standalone C++ suite with TSan
        run: TSAN_OPTIONS='halt_on_error=1:second_deadlock_stack=1' CXX=clang++ bash scripts/run-cpp-tsan-tests.sh

  cpp-linux:
    name: C++ unit tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang llvm libboost-all-dev libssl-dev ripgrep iproute2

      - name: Include boundary checks
        run: bash tools/check_include_boundaries.sh

      - name: Repository architecture checks
        run: |
          python3 -m unittest tests.tooling.test_repository_layout -v
          python3 -m unittest tests.tooling.test_ci_workspace_permissions -v
          python3 -m unittest tests.tooling.test_vmux_transport_boundary -v
          python3 -m unittest tests.tooling.test_vmux_receive_semantics_ci -v
          python3 -m unittest tests.tooling.test_proxy_only_static_wiring -v
          python3 -m unittest tests.tooling.test_p2p_capability_wiring -v
          python3 -m unittest tests.tooling.test_windows_dns_snapshot_contract -v
          python3 -m unittest tests.tooling.test_windows_network_resource_contract -v
          python3 -m unittest tests.tooling.test_windows_ipv6_contract -v
          python3 -m unittest tests.tooling.test_lifecycle_wiring -v
          python3 -m unittest tests.tooling.test_ci_workflow_contract -v
          python3 -m unittest tests.tooling.test_network_lifecycle_issue_pack -v
          python3 -m unittest tests.tooling.test_network_lifecycle_publish_boundary -v
          PYTHONDONTWRITEBYTECODE=1 python3 tests/tooling/test_datapath_acceptance.py
          python3 tools/check_repository_layout.py

      - name: Documentation governance checks
        run: |
          python3 -m unittest tests.tooling.test_check_docs -v
          python3 tools/check_docs.py

      - name: Linux namespace Route/DNS rollback
        run: |
          mkdir -p "$PWD/build/route-dns-rollback"
          sudo OPENPPP2_NAMESPACE_ARTIFACT_DIR="$PWD/build/route-dns-rollback" bash tests/integration/linux/route_dns_rollback.sh

      - name: Upload Route/DNS rollback snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-dns-rollback-snapshots
          path: build/route-dns-rollback
          retention-days: 7

      - name: MSVC project source parity
        run: bash tools/check_vcxproj_sources.sh

      - name: Prepare pinned XTCP
        run: bash tools/prepare_xtcp.sh

      - name: Configure
        run: |
          cmake -S tests/cpp -B build/test \
            -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DENABLE_COVERAGE=ON \
            -DENABLE_XTCP_TESTS=ON

      - name: Build
        run: cmake --build build/test

      - name: Runtime contract (C++)
        run: bash scripts/test-runtime-contract.sh cpp

      - name: Run tests
        run: |
          mkdir -p build/coverage
          LLVM_PROFILE_FILE="$PWD/build/coverage/%p-%m.profraw" \
            ctest --test-dir build/test --output-on-failure -j$(nproc)

      - name: Coverage report
        run: |
          shopt -s nullglob
          profraw=(build/coverage/*.profraw)
          if [ ${#profraw[@]} -eq 0 ]; then
            echo "No profraw files found"
            exit 1
          fi
          llvm-profdata merge -sparse build/coverage/*.profraw -o build/coverage/merged.profdata
          bins="build/test/p2p_replay_window_test build/test/dns_buffer_test build/test/dns_message_test build/test/dns_server_validation_test build/test/dns_wire_validation_test build/test/base64_test build/test/sysctl_validation_test"
          llvm-cov report $bins \
            -instr-profile=build/coverage/merged.profdata \
            tests/cpp common/dnslib common/base64 ppp/p2p \
            | tee build/coverage/summary.txt

      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cpp-summary
          path: build/coverage/summary.txt
          retention-days: 7

      - name: Configure upstream XTCP suite
        run: |
          cmake -S third-party/xtcp -B build/xtcp-suite \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DXTCP_BUILD_TESTS=ON

      - name: Build upstream XTCP suite
        run: cmake --build build/xtcp-suite

      # The local patch stack (tools/xtcp-patches) still fails 13-15 upstream
      # tests (tracked as M1 item 1.2 in issue #91). Report them without
      # failing the job until that work lands, then drop continue-on-error.
      - name: Run upstream XTCP suite
        continue-on-error: true
        run: ctest --test-dir build/xtcp-suite --output-on-failure -j$(nproc)

      # build/test is coverage-instrumented, so throughput comes from a
      # separate Release build of the bridge test alone.
      - name: Capture throughput JSON
        run: |
          cmake -S tests/cpp -B build/xtcp-bench \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_XTCP_TESTS=ON
          cmake --build build/xtcp-bench --target xtcp_runtime_bridge_test
          mkdir -p build/xtcp-bench/results
          build/xtcp-bench/xtcp_runtime_bridge_test --throughput xtcp 3 \
            > build/xtcp-bench/results/xtcp.jsonl
          build/xtcp-bench/xtcp_runtime_bridge_test --throughput native 3 \
            > build/xtcp-bench/results/native.jsonl

      - name: Upload throughput JSON
        uses: actions/upload-artifact@v4
        with:
          name: xtcp-smoke-throughput
          path: build/xtcp-bench/results/*.jsonl
          if-no-files-found: error
          retention-days: 7

      - name: Write lifecycle acceptance summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 tools/write_network_lifecycle_summary.py \
            --job-status "$JOB_STATUS" \
            --output build/lifecycle-acceptance/summary.json
          python3 tools/verify_network_lifecycle_summary.py \
            build/lifecycle-acceptance/summary.json

      - name: Upload lifecycle acceptance summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-acceptance-summary
          path: build/lifecycle-acceptance/summary.json
          if-no-files-found: error
          retention-days: 7

  go:
    name: Go unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go/guardian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Test
        run: |
          mkdir -p build/coverage
          go test ./... -coverprofile=build/coverage/go.out -covermode=atomic
          go tool cover -func=build/coverage/go.out | tee build/coverage/go-summary.txt
      - name: Vet and test the manager backend
        working-directory: go
        run: |
          go vet ./ppp/...
          go test ./ppp/...
      - name: Upload Go coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-go
          path: go/build/coverage/go-summary.txt
          retention-days: 7

  desktop-rust:
    name: Desktop frontend and Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    defaults:
      run:
        working-directory: desktop/client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/client/package-lock.json

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev \
            libgtk-3-dev libssl-dev libwebkit2gtk-4.1-dev \
            librsvg2-dev libxdo-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Build frontend assets
        run: npm run build

      - name: Rust unit and integration tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  flutter:
    name: Flutter unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Test
        run: |
          flutter pub get
          bash ../scripts/test-runtime-contract.sh dart
          flutter test --coverage
          echo "Flutter tests completed" | tee coverage/flutter-summary.txt
      - name: Upload Flutter coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-flutter
          path: android/coverage/flutter-summary.txt
          retention-days: 7

  ios-simulator:
    name: iOS unit tests (simulator)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios/App
    steps:
      - uses: actions/checkout@v4
      - name: Typecheck PacketTunnel P2P provider transport
        run: |
          sdk_root="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          swiftc -typecheck \
            -sdk "$sdk_root" \
            -target "$(uname -m)-apple-ios15.0-simulator" \
            -I .. \
            OpenPPP2PacketTunnel/ProviderOwnedP2PDatagramTransport.swift
      - name: Run XCTest
        run: |
          chmod +x run-tests.sh
          bash ../../scripts/test-runtime-contract.sh swift
          ./run-tests.sh
