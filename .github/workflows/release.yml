name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string
      title:
        description: 'Release title'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

jobs:
  release:
    name: Verify CI and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Resolve and verify release revision
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if ! git check-ref-format "refs/tags/${RELEASE_TAG}"; then
            echo "::error::Invalid release tag: ${RELEASE_TAG}"
            exit 1
          fi

          tag_sha=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          resolve_remote_tag_commit() {
            local object_type object_sha tag_json depth
            tag_json=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")
            object_type=$(jq -r '.object.type' <<<"$tag_json")
            object_sha=$(jq -r '.object.sha' <<<"$tag_json")
            for ((depth = 0; depth < 8; depth++)); do
              if [[ "$object_type" == "commit" ]]; then
                printf '%s\n' "$object_sha"
                return 0
              fi
              if [[ "$object_type" != "tag" ]]; then
                echo "::error::Remote tag does not resolve to a commit"
                return 1
              fi
              tag_json=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")
              object_type=$(jq -r '.object.type' <<<"$tag_json")
              object_sha=$(jq -r '.object.sha' <<<"$tag_json")
            done
            echo "::error::Remote tag nesting exceeds the supported limit"
            return 1
          }

          remote_sha=$(resolve_remote_tag_commit)
          if [[ "$remote_sha" != "$tag_sha" ]]; then
            echo "::error::Remote tag points to ${remote_sha}, checkout resolved to ${tag_sha}"
            exit 1
          fi
          echo "tag_sha=${tag_sha}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${RELEASE_TAG} at ${tag_sha}"

      - name: Require successful CI for the release revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.tag_sha }}
        shell: bash
        run: |
          set -euo pipefail

          required_workflows=(
            "build-android.yml"
            "build-linux-amd64.yml"
            "build-linux-cross.yml"
            "build-macos.yml"
            "build-windows-x64.yml"
            "build-windows-arm64.yml"
            "build-go-guardian.yml"
            "test.yml"
            "docs.yml"
            "test-linux-coverage.yml"
          )
          mkdir -p artifacts
          : > build-provenance.txt
          printf 'tag_sha=%s\n' "$RELEASE_SHA" >> build-provenance.txt

          for workflow in "${required_workflows[@]}"; do
            echo "Checking latest $workflow run for ${RELEASE_SHA}..."
            run_id=$(gh run list \
              --workflow="$workflow" \
              --commit="$RELEASE_SHA" \
              --limit=1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')
            if [[ -z "$run_id" ]]; then
              echo "::error::No run found for $workflow at ${RELEASE_SHA}"
              exit 1
            fi

            run_summary=$(gh run view "$run_id" --json headSha,conclusion \
              --jq '[.headSha, (.conclusion // "pending")] | @tsv')
            IFS=$'\t' read -r run_sha conclusion <<<"$run_summary"
            if [[ "$run_sha" != "$RELEASE_SHA" || "$conclusion" != "success" ]]; then
              echo "::error::$workflow run $run_id is ${conclusion} at ${run_sha}; expected success at ${RELEASE_SHA}"
              exit 1
            fi
            printf '%s_run_id=%s\n' "${workflow%.yml}" "$run_id" >> build-provenance.txt

            case "$workflow" in
              test.yml|docs.yml|test-linux-coverage.yml) continue ;;
            esac

            artifact_dir="artifacts/${workflow%.yml}"
            mkdir -p "$artifact_dir"
            gh run download "$run_id" --dir "$artifact_dir"
            mapfile -d '' package_files < <(find "$artifact_dir" -type f \
              \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.apk' \) -print0)
            if (( ${#package_files[@]} == 0 )); then
              echo "::error::$workflow produced no distributable archives for ${RELEASE_SHA}"
              exit 1
            fi
            for package in "${package_files[@]}"; do
              if [[ ! -s "$package" ]]; then
                echo "::error::Empty package from $workflow: ${package}"
                exit 1
              fi
            done
            printf '%s_package_count=%s\n' "${workflow%.yml}" "${#package_files[@]}" >> build-provenance.txt
          done

          if ! find artifacts/build-android -type f -name '*.apk' -size +0c -print -quit | grep -q .; then
            echo "::error::Android release APK is missing or empty"
            exit 1
          fi

      - name: Prepare release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          declare -A seen_names=()
          while IFS= read -r -d '' package; do
            name=$(basename "$package")
            if [[ -n "${seen_names[$name]+present}" ]]; then
              echo "::error::Duplicate release asset basename: ${name}"
              exit 1
            fi
            seen_names[$name]=1
            cp -- "$package" "release-assets/${name}"
          done < <(find artifacts -type f \
            \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.apk' \) -print0 | sort -z)

          required_package_assets=(
            "app-release.apk"
            "guardian-linux-amd64.tar.gz"
            "guardian-linux-arm64.tar.gz"
            "guardian-darwin-amd64.tar.gz"
            "guardian-darwin-arm64.tar.gz"
            "guardian-windows-amd64.zip"
            "openppp2-android-arm64-v8a.zip"
            "openppp2-android-armeabi-v7a.zip"
            "openppp2-android-x86.zip"
            "openppp2-android-x86_64.zip"
            "openppp2-darwin-arm64.zip"
            "openppp2-darwin-x86_64.zip"
            "openppp2-darwin-arm64-asan.zip"
            "openppp2-darwin-x86_64-asan.zip"
            "openppp2-linux-aarch64-cross.zip"
            "openppp2-linux-armv7l-cross.zip"
            "openppp2-linux-riscv64-cross.zip"
            "openppp2-linux-ppc64el-cross.zip"
            "openppp2-linux-s390x-cross.zip"
            "openppp2-linux-mipsel-cross.zip"
            "openppp2-linux-amd64.zip"
            "openppp2-linux-amd64-io-uring.zip"
            "openppp2-linux-amd64-simd.zip"
            "openppp2-linux-amd64-tc.zip"
            "openppp2-linux-amd64-tc-io-uring.zip"
            "openppp2-linux-amd64-tc-simd.zip"
            "openppp2-linux-amd64-io-uring-simd.zip"
            "openppp2-linux-amd64-tc-io-uring-simd.zip"
            "openppp2-linux-amd64-debian10.zip"
            "openppp2-linux-amd64-asan.zip"
            "openppp2-windows-x64-Release.zip"
            "openppp2-windows-ARM64-Release.zip"
          )
          if (( ${#required_package_assets[@]} != 32 )); then
            echo "::error::Release package manifest must contain exactly 32 assets"
            exit 1
          fi
          for name in "${required_package_assets[@]}"; do
            if [[ ! -s "release-assets/${name}" ]]; then
              echo "::error::Required release package is missing or empty: ${name}"
              exit 1
            fi
          done
          mapfile -t actual_package_assets < <(find release-assets -maxdepth 1 -type f \
            \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.apk' \) -printf '%f\n' | sort)
          if (( ${#actual_package_assets[@]} != ${#required_package_assets[@]} )); then
            echo "::error::Expected exactly ${#required_package_assets[@]} package assets, found ${#actual_package_assets[@]}"
            exit 1
          fi

          cp build-provenance.txt release-assets/build-provenance.txt
          cat > release-assets/RELEASE-NOTES.txt <<'NOTES'
          ASan archives are diagnostic builds for debugging and sanitizer analysis. They are not production binaries; use the matching non-ASan platform archive for normal use.
          NOTES
          (
            cd release-assets
            sha256sum -- * > SHA256SUMS.txt
          )
          echo "Release assets:"
          find release-assets -maxdepth 1 -type f -printf '%f\t%s bytes\n' | sort

      - name: Create draft release and upload verified assets
        id: draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ steps.release.outputs.tag_sha }}
          name: ${{ inputs.title }}
          prerelease: ${{ inputs.prerelease }}
          draft: true
          body: ASan archives are diagnostic builds for debugging and sanitizer analysis. They are not production binaries; use the matching non-ASan platform archive for normal use.
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Recheck remote tag and publish draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.tag_sha }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          tag_json=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")
          object_type=$(jq -r '.object.type' <<<"$tag_json")
          object_sha=$(jq -r '.object.sha' <<<"$tag_json")
          depth=0
          while [[ "$object_type" == "tag" && $depth -lt 8 ]]; do
            tag_json=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")
            object_type=$(jq -r '.object.type' <<<"$tag_json")
            object_sha=$(jq -r '.object.sha' <<<"$tag_json")
            depth=$((depth + 1))
          done
          if [[ "$object_type" != "commit" || "$object_sha" != "$RELEASE_SHA" ]]; then
            echo "::error::Remote tag changed before publication (resolved ${object_type} ${object_sha}, expected ${RELEASE_SHA})"
            exit 1
          fi
          if [[ ! "$RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Draft release action did not provide a valid release ID"
            exit 1
          fi
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false
